[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "weibo-checkin-selfhost"
version = "0.1.0"
description = "Self-hosted Weibo super-topic check-in runner"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Open Source Contributors" }]
dependencies = ["requests>=2.32.0"]

[project.scripts]
weibo-auto-signin = "weibo_auto_signin.cli:main"
weibo-checkin = "weibo_auto_signin.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.4.2"]
login = ["playwright>=1.53.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/weibo_auto_signin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
